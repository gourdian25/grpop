version: 2

project_name: grpop

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  # Library project — no binaries (example/ is a demo program, not a
  # shipped CLI tool).
  - skip: true

archives:
  - id: source
    # Not tied to any build — the only build above is skipped (pure
    # library, no binary), so without meta:true this archive silently
    # produces nothing (confirmed pattern from grnoti's/grcache's own
    # .goreleaser.yaml).
    meta: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_src"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - go.mod
      - go.sum
      # Both patterns are needed: "**/*.go" only matches files at least one
      # directory deep, so root-level files (interfaces.go/types.go/...)
      # need "*.go" too.
      - "*.go"
      - "**/*.go"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: gourdian25
    name: grpop
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
  header: |
    ## {{ .ProjectName }} {{ .Version }}

    Send-only, multi-channel transactional-messaging delivery library for the
    gourdian ecosystem: email (stdlib SMTP, any vendor) and WhatsApp (Meta
    Cloud API, direct) dispatch, idempotent send processing, a hard-deadline
    dead-letter retry queue, circuit breaking, and per-channel-and-per-recipient
    rate limiting, behind a set of storage- and vendor-agnostic interfaces.

    See [CHANGELOG.md](https://github.com/gourdian25/grpop/blob/master/CHANGELOG.md) for full details.

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^build:'
      - '^refactor:'
      - '^style:'
      - README
      - Merge pull request
